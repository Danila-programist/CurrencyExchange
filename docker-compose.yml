services:
  db:
    image: postgres:15
    container_name: "currency_exchange_db"
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  redis:
    image: redis:7
    container_name: "currency_exchange_redis"
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data 
    
  backend:
    build: .
    container_name: "currency_exchange_backend"
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             poetry run uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app



volumes:
  postgres_data:
  redis_data: