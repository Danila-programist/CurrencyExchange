services:
  db:
    image: postgres:15
    container_name: "currency_exchange_db"
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  redis:
    image: redis:7
    container_name: "currency_exchange_redis"
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data 

volumes:
  postgres_data:
  redis_data: